spring.application.name=IdentityService
server.port=8080
#spring.datasource.url=jdbc:mysql://localhost:3306/e-commercewebsite?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.url=jdbc:mariadb://localhost:3306/e-commercewebsite
spring.datasource.username=root
spring.datasource.password=root
server.servlet.context-path=/identity-service
spring.security.oauth2.resourceserver.jwt.public-key-location=nEoUjd2xJlGSiBO1y4KXTcsEMHdNxFdl

